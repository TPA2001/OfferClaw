<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfferClaw — 求职 AI Agent</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="styles/main.css?v=9">
    <script>
        // 主题引导：在首次绘制前应用，避免 FOUC（闪烁）
        (function () {
            try {
                var t = localStorage.getItem('oc_theme') || 'paper';
                var dark = { ink: 1, forest: 1, ocean: 1 };
                document.documentElement.setAttribute('data-theme', t);
                // body 还未解析，用 documentElement 上的类作为标记，DOMContentLoaded 后同步到 body
                if (dark[t]) document.documentElement.classList.add('is-dark-pending');
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="app-shell">
        <!-- 顶栏 -->
        <header class="app-topbar">
            <div class="topbar-brand">
                <div class="brand-mark">OC</div>
                <span>OfferClaw</span>
            </div>
            <div class="topbar-actions">
                <div class="topbar-health" id="health-indicator" title="后端连接状态">
                    <span class="health-dot"></span>
                    <span class="health-text">检查中</span>
                </div>
                <button class="icon-btn" id="btn-back-chat" title="返回对话" style="width:auto;padding:0 0.7rem;gap:0.3rem;font-size:0.8rem;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>对话</span>
                </button>
            </div>
        </header>

        <!-- 侧边导航 -->
        <nav class="app-nav">
            <button class="nav-item" data-route="/chat">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </span>
                <span class="nav-label">AI 对话</span>
            </button>

            <div class="nav-section-label">求职管理</div>
            <button class="nav-item" data-route="/kanban">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                </span>
                <span class="nav-label">投递看板</span>
            </button>
            <button class="nav-item" data-route="/jobs">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </span>
                <span class="nav-label">岗位搜索</span>
            </button>
            <button class="nav-item" data-route="/profile">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </span>
                <span class="nav-label">简历画像</span>
            </button>
            <!-- 智能填表正在升级为浏览器插件，暂时屏蔽入口
            <button class="nav-item" data-route="/smart-fill">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                </span>
                <span class="nav-label">智能填表</span>
            </button>
            -->
            <button class="nav-item" data-route="/interview">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                </span>
                <span class="nav-label">面试复盘</span>
            </button>

            <div class="nav-spacer"></div>

            <div class="nav-section-label">系统</div>
            <button class="nav-item" data-route="/settings">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </span>
                <span class="nav-label">设置</span>
            </button>
        </nav>

        <!-- 主内容区（视图挂载点） -->
        <main class="app-main">
            <div id="view-mount"></div>
        </main>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container"></div>

    <!-- 共享脚本 -->
    <script src="config.js?v=7"></script>
    <script src="motion.js?v=5"></script>
    <script src="app/api.js?v=5"></script>
    <script src="app/markdown.js?v=5"></script>
    <script src="app/router.js?v=5"></script>

    <!-- 视图脚本 -->
    <script src="app/views/chat.js?v=5"></script>
    <script src="app/views/kanban.js?v=13"></script>
    <script src="app/views/profile.js?v=8"></script>
    <script src="app/views/jobs.js?v=7"></script>
    <script src="app/views/smart-fill.js?v=6"></script>
    <script src="app/views/interview.js?v=6"></script>
    <script src="app/views/settings.js?v=6"></script>

    <!-- 主控制器 -->
    <script src="app/app.js?v=6"></script>
</body>
</html>
