<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfferCabin — 求职投递看板</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="styles/main.css?v=10">
    <script>
        // 主题引导：在首次绘制前应用，避免 FOUC（闪烁）
        (function () {
            try {
                var t = localStorage.getItem('oc_theme') || 'paper';
                var dark = { ink: 1, forest: 1, ocean: 1 };
                document.documentElement.setAttribute('data-theme', t);
                if (dark[t]) document.documentElement.classList.add('is-dark-pending');
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="app-shell">
        <!-- 顶栏 -->
        <header class="app-topbar">
            <div class="topbar-brand">
                <div class="brand-mark">OC</div>
                <span>OfferCabin</span>
            </div>
            <div class="topbar-actions">
                <div class="topbar-health" id="health-indicator" title="后端连接状态">
                    <span class="health-dot"></span>
                    <span class="health-text">检查中</span>
                </div>
                <div class="topbar-user" id="topbar-user" title="当前登录用户">
                    <span class="user-avatar" id="user-avatar">OC</span>
                    <span class="user-name" id="current-user"></span>
                    <button class="icon-btn logout-btn" id="btn-logout" title="退出登录" aria-label="退出登录">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- 侧边导航 -->
        <nav class="app-nav">
            <div class="nav-section-label">求职管理</div>
            <button class="nav-item" data-route="/chat">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </span>
                <span class="nav-label">AI 求职助手</span>
            </button>
            <button class="nav-item" data-route="/overview">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                </span>
                <span class="nav-label">投递总览</span>
            </button>
            <button class="nav-item" data-route="/kanban">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                </span>
                <span class="nav-label">投递看板</span>
            </button>
            <button class="nav-item" data-route="/profile">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </span>
                <span class="nav-label">简历画像</span>
            </button>
            <button class="nav-item" data-route="/interview">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                </span>
                <span class="nav-label">面试复盘</span>
            </button>

            <div class="nav-section-label">互助社区</div>
            <button class="nav-item" data-route="/community">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </span>
                <span class="nav-label">社区广场</span>
            </button>
            <button class="nav-item" data-route="/job-shares">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                </span>
                <span class="nav-label">投递分享</span>
            </button>

            <div class="nav-spacer"></div>

            <div class="nav-section-label">系统</div>
            <a class="nav-item" id="nav-admin" data-admin href="#" target="_blank" rel="noopener" style="display:none">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </span>
                <span class="nav-label">管理后台</span>
            </a>
            <button class="nav-item" data-route="/settings">
                <span class="nav-ico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </span>
                <span class="nav-label">设置</span>
            </button>
        </nav>

        <!-- 主内容区（视图挂载点） -->
        <main class="app-main">
            <div id="view-mount"></div>
        </main>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container"></div>

    <!-- 共享脚本 -->
    <script src="config.js?v=7"></script>
    <script src="motion.js?v=5"></script>
    <script src="app/api.js?v=8"></script>
    <script src="app/markdown.js?v=6"></script>
    <script src="app/router.js?v=8"></script>

    <!-- 视图脚本 -->
    <script src="app/views/chat.js?v=2"></script>
    <script src="app/views/overview.js?v=2"></script>
    <script src="app/views/kanban.js?v=24"></script>
    <script src="app/views/profile.js?v=11"></script>
    <script src="app/views/interview.js?v=6"></script>
    <script src="app/views/community.js?v=1"></script>
    <script src="app/views/job-shares.js?v=2"></script>
    <script src="app/views/settings.js?v=9"></script>

    <!-- 主控制器 -->
    <script src="app/app.js?v=9"></script>
</body>
</html>
