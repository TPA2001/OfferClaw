<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人画像 - OfferClaw</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f5f1e8;
            --paper-light: #faf8f3;
            --card: #fefdf9;
            --ink: #2d2a26;
            --ink-soft: #6b665e;
            --ink-faint: #a8a299;
            --olive: #6b7d0a;
            --olive-dark: #556b08;
            --olive-soft: #e8ebd0;
            --terra: #c4664a;
            --line: #e0dacd;
            --line-soft: #ece7da;
            --danger: #b94a3a;
            --success: #5a7a3a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 20% 10%, rgba(107,125,10,0.04) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(196,102,74,0.03) 0%, transparent 40%);
        }

        .navbar {
            background: var(--card);
            border-bottom: 1px solid var(--line);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        .nav-brand h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.4rem;
            color: var(--olive);
            margin: 0;
            letter-spacing: 0.5px;
        }
        .nav-brand p { margin: 0; font-size: 0.75rem; color: var(--ink-faint); }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-links a {
            text-decoration: none;
            color: var(--ink-soft);
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.4rem 0.2rem;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .nav-links a:hover { color: var(--olive); }
        .nav-links a.active {
            color: var(--olive);
            border-bottom-color: var(--olive);
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 2.5rem 2rem 4rem;
        }

        /* 页面标题 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2rem;
            padding-bottom: 1.2rem;
            border-bottom: 2px solid var(--ink);
            position: relative;
        }
        .page-header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 60px;
            height: 2px;
            background: var(--olive);
        }
        .page-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--ink);
            margin: 0;
        }
        .page-subtitle {
            font-size: 0.85rem;
            color: var(--ink-faint);
            margin: 0.3rem 0 0;
        }
        .header-actions { display: flex; gap: 0.6rem; }

        /* 按钮 */
        .btn {
            padding: 0.55rem 1.2rem;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--olive);
            color: white;
        }
        .btn-primary:hover {
            background: var(--olive-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(107,125,10,0.25);
        }
        .btn-ghost {
            background: transparent;
            color: var(--ink-soft);
            border: 1px solid var(--line);
        }
        .btn-ghost:hover {
            background: var(--card);
            border-color: var(--olive);
            color: var(--olive);
        }
        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--line);
        }
        .btn-danger:hover { background: #fbeae6; border-color: var(--danger); }
        .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.8rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 标签栏 */
        .tabs {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
        }
        .tab {
            padding: 0.7rem 1.1rem;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 0.88rem;
            color: var(--ink-soft);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .tab:hover { color: var(--olive); }
        .tab.active {
            color: var(--olive);
            border-bottom-color: var(--olive);
            font-weight: 600;
        }
        .tab-badge {
            background: var(--olive-soft);
            color: var(--olive-dark);
            font-size: 0.7rem;
            padding: 0.1rem 0.45rem;
            border-radius: 10px;
            font-weight: 600;
        }

        /* 面板 */
        .panel { display: none; animation: fadeIn 0.3s ease; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: box-shadow 0.2s;
        }
        .card:hover { box-shadow: 0 2px 12px rgba(45,42,38,0.06); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.7rem;
            border-bottom: 1px dashed var(--line-soft);
        }
        .card-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--ink);
            margin: 0;
        }
        .card-index {
            font-size: 0.75rem;
            color: var(--ink-faint);
            font-family: 'Noto Serif SC', serif;
            font-style: italic;
        }

        /* 表单 */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .form-field { display: flex; flex-direction: column; gap: 0.35rem; }
        .form-field.full { grid-column: 1 / -1; }
        .form-field label {
            font-size: 0.78rem;
            color: var(--ink-soft);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 0.55rem 0.7rem;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 0.88rem;
            font-family: inherit;
            color: var(--ink);
            background: var(--paper-light);
            transition: all 0.2s;
        }
        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: var(--olive);
            background: white;
            box-shadow: 0 0 0 3px rgba(107,125,10,0.1);
        }
        .form-field textarea { resize: vertical; min-height: 70px; }
        .form-field .hint { font-size: 0.72rem; color: var(--ink-faint); }

        /* 技能标签 */
        .skills-editor {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            padding: 0.5rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--paper-light);
            min-height: 48px;
        }
        .skill-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: var(--olive-soft);
            color: var(--olive-dark);
            padding: 0.3rem 0.65rem;
            border-radius: 16px;
            font-size: 0.82rem;
            font-weight: 500;
            animation: tagPop 0.2s ease;
        }
        @keyframes tagPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .skill-tag .remove {
            cursor: pointer;
            opacity: 0.6;
            font-size: 0.85rem;
            line-height: 1;
        }
        .skill-tag .remove:hover { opacity: 1; color: var(--danger); }
        .skills-editor input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.85rem;
            font-family: inherit;
            flex: 1;
            min-width: 120px;
            color: var(--ink);
        }

        /* 空状态 */
        .empty-card {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--ink-faint);
            border: 1px dashed var(--line);
            border-radius: 10px;
            background: var(--paper-light);
        }
        .empty-card p { margin: 0.3rem 0; font-size: 0.88rem; }
        .empty-card .empty-icon { font-size: 1.8rem; opacity: 0.5; }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 3px solid var(--olive);
            padding: 0.7rem 1.1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--ink);
            box-shadow: 0 6px 20px rgba(45,42,38,0.12);
            animation: slideIn 0.3s ease;
            max-width: 320px;
        }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* 完成度指示器 */
        .completion-bar {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
            padding: 0.8rem 1.2rem;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
        }
        .completion-track {
            flex: 1;
            height: 6px;
            background: var(--line-soft);
            border-radius: 3px;
            overflow: hidden;
        }
        .completion-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--olive), var(--olive-dark));
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .completion-text {
            font-size: 0.8rem;
            color: var(--ink-soft);
            white-space: nowrap;
        }
        .completion-text strong { color: var(--olive); font-size: 0.95rem; }

        /* 城市标签输入 */
        .cities-editor {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            padding: 0.5rem;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--paper-light);
            min-height: 42px;
        }
        .city-tag {
            background: #f0e6da;
            color: var(--ink);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .city-tag .remove { cursor: pointer; opacity: 0.5; }
        .city-tag .remove:hover { opacity: 1; color: var(--danger); }
        .cities-editor input {
            border: none; background: transparent; outline: none;
            font-family: inherit; font-size: 0.85rem; min-width: 80px;
        }

        .row-actions {
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px dashed var(--line-soft);
        }

        .add-btn {
            width: 100%;
            padding: 0.7rem;
            background: transparent;
            border: 1px dashed var(--line);
            border-radius: 8px;
            color: var(--ink-soft);
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-btn:hover {
            border-color: var(--olive);
            color: var(--olive);
            background: var(--olive-soft);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--ink-faint);
        }
        .spinner {
            display: inline-block;
            width: 28px; height: 28px;
            border: 3px solid var(--line);
            border-top-color: var(--olive);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            .nav-links { gap: 0.8rem; font-size: 0.85rem; }
            .container { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand" style="text-decoration:none;color:inherit;">
            <div class="nav-brand-mark">O</div>
            <div class="nav-brand-text">
                <h1>OfferClaw</h1>
                <p>Job Hunt Archive</p>
            </div>
        </a>
        <div class="nav-links">
            <a href="index.html">看板</a>
            <a href="profile.html" class="active">个人画像</a>
            <a href="smart-fill.html">智能填写</a>
            <a href="agent.html">Agent</a>
            <a href="settings.html">设置</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h2 class="page-title">个人画像</h2>
                <p class="page-subtitle">维护你的求职信息，Agent 和智能填写会自动读取这些数据</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-ghost btn-sm" onclick="loadProfile()">↻ 重新加载</button>
                <button class="btn btn-primary btn-sm" onclick="saveAll()">💾 保存全部</button>
            </div>
        </div>

        <div class="completion-bar">
            <span class="completion-text">画像完成度</span>
            <div class="completion-track"><div class="completion-fill" id="completionFill" style="width:0%"></div></div>
            <span class="completion-text"><strong id="completionPct">0%</strong></span>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="basic">👤 基本信息</button>
            <button class="tab" data-tab="education">🎓 教育 <span class="tab-badge" id="eduCount">0</span></button>
            <button class="tab" data-tab="experience">💼 经历 <span class="tab-badge" id="expCount">0</span></button>
            <button class="tab" data-tab="skills">⚡ 技能 <span class="tab-badge" id="skillCount">0</span></button>
            <button class="tab" data-tab="intent">🎯 求职意向</button>
        </div>

        <!-- 基本信息 -->
        <div class="panel active" id="panel-basic">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">基本信息</h3>
                    <span class="card-index">I</span>
                </div>
                <div class="form-grid">
                    <div class="form-field">
                        <label>姓名</label>
                        <input type="text" id="basic_name" placeholder="张三">
                    </div>
                    <div class="form-field">
                        <label>手机号</label>
                        <input type="tel" id="basic_phone" placeholder="138xxxx">
                    </div>
                    <div class="form-field">
                        <label>邮箱</label>
                        <input type="email" id="basic_email" placeholder="name@example.com">
                    </div>
                    <div class="form-field">
                        <label>性别</label>
                        <select id="basic_gender">
                            <option value="">未设置</option>
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>出生年月</label>
                        <input type="month" id="basic_birth">
                    </div>
                </div>
            </div>
            <p style="font-size:0.78rem;color:var(--ink-faint);padding:0.5rem;">
                🔒 身份证号、家庭住址等敏感信息不在此录入，由本地浏览器扩展填写，服务器不存储。
            </p>
        </div>

        <!-- 教育经历 -->
        <div class="panel" id="panel-education">
            <div id="educationList"></div>
            <button class="add-btn" onclick="addEducation()">＋ 添加教育经历</button>
        </div>

        <!-- 工作经历 -->
        <div class="panel" id="panel-experience">
            <div id="experienceList"></div>
            <button class="add-btn" onclick="addExperience()">＋ 添加工作经历</button>
        </div>

        <!-- 技能 -->
        <div class="panel" id="panel-skills">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">技能清单</h3>
                    <span class="card-index">IV</span>
                </div>
                <p style="font-size:0.8rem;color:var(--ink-soft);margin-bottom:0.8rem;">
                    输入技能名后按 Enter 添加，支持技术栈、语言、软技能等
                </p>
                <div class="skills-editor" id="skillsEditor">
                    <input type="text" id="skillInput" placeholder="输入技能后按 Enter...">
                </div>
            </div>
        </div>

        <!-- 求职意向 -->
        <div class="panel" id="panel-intent">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">求职意向</h3>
                    <span class="card-index">V</span>
                </div>
                <div class="form-grid">
                    <div class="form-field">
                        <label>目标岗位</label>
                        <input type="text" id="intent_role" placeholder="后端开发工程师">
                    </div>
                    <div class="form-field">
                        <label>工作性质</label>
                        <select id="intent_job_type">
                            <option value="全职">全职</option>
                            <option value="实习">实习</option>
                            <option value="兼职">兼职</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>期望薪资下限（K）</label>
                        <input type="number" id="intent_salary_min" placeholder="15" min="0">
                    </div>
                    <div class="form-field">
                        <label>期望薪资上限（K）</label>
                        <input type="number" id="intent_salary_max" placeholder="25" min="0">
                    </div>
                    <div class="form-field full">
                        <label>意向城市</label>
                        <div class="cities-editor" id="citiesEditor">
                            <input type="text" id="cityInput" placeholder="输入城市后按 Enter...">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const API_BASE = "http://localhost:8000";
        const TOKEN = "demo-token";

        let profile = {
            basic_info: {},
            education: [],
            experience: [],
            skills: [],
            job_intent: {},
            extra_fields: {},
        };

        // ============ API ============
        async function apiGet(path) {
            const r = await fetch(API_BASE + path, {
                headers: { 'Authorization': `Bearer ${TOKEN}` },
            });
            if (!r.ok) throw new Error(`${r.status}`);
            return r.json();
        }
        async function apiPost(path, body) {
            const r = await fetch(API_BASE + path, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${TOKEN}`,
                },
                body: JSON.stringify(body),
            });
            if (!r.ok) throw new Error(`${r.status}`);
            return r.json();
        }

        // ============ Toast ============
        function toast(msg, type = 'success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(20px)'; setTimeout(() => t.remove(), 300); }, 2600);
        }

        // ============ Tab 切换 ============
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
            });
        });

        // ============ 加载画像 ============
        async function loadProfile() {
            try {
                const res = await apiGet('/api/v1/profiles/');
                if (res.code === 0) {
                    profile = { ...profile, ...res.data };
                    renderAll();
                    toast('画像已加载', 'success');
                }
            } catch (e) {
                toast('加载失败：' + e.message, 'error');
            }
        }

        // ============ 渲染 ============
        function renderAll() {
            renderBasic();
            renderEducation();
            renderExperience();
            renderSkills();
            renderIntent();
            updateCompletion();
        }

        function renderBasic() {
            const b = profile.basic_info || {};
            document.getElementById('basic_name').value = b.name || '';
            document.getElementById('basic_phone').value = b.phone || '';
            document.getElementById('basic_email').value = b.email || '';
            document.getElementById('basic_gender').value = b.gender || '';
            document.getElementById('basic_birth').value = b.birth || '';
        }

        function renderEducation() {
            const list = document.getElementById('educationList');
            list.innerHTML = '';
            const edus = profile.education || [];
            document.getElementById('eduCount').textContent = edus.length;
            if (edus.length === 0) {
                list.innerHTML = '<div class="empty-card"><div class="empty-icon">🎓</div><p>还没有教育经历</p><p>点击下方按钮添加</p></div>';
                return;
            }
            edus.forEach((e, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="card-title">教育经历 ${i + 1}</h3>
                        <span class="card-index">${roman(i + 1)}</span>
                    </div>
                    <div class="form-grid">
                        <div class="form-field"><label>学校</label><input type="text" value="${esc(e.school || '')}" data-field="school" data-idx="${i}"></div>
                        <div class="form-field"><label>专业</label><input type="text" value="${esc(e.major || '')}" data-field="major" data-idx="${i}"></div>
                        <div class="form-field"><label>学历</label>
                            <select data-field="degree" data-idx="${i}">
                                <option value="大专" ${e.degree==='大专'?'selected':''}>大专</option>
                                <option value="本科" ${e.degree==='本科'?'selected':''}>本科</option>
                                <option value="硕士" ${e.degree==='硕士'?'selected':''}>硕士</option>
                                <option value="博士" ${e.degree==='博士'?'selected':''}>博士</option>
                            </select>
                        </div>
                        <div class="form-field full"><label>起止时间</label>
                            <div style="display:flex;gap:0.5rem;align-items:center;">
                                <input type="month" value="${esc(e.start_date || '')}" data-field="start_date" data-idx="${i}" style="flex:1">
                                <span style="color:var(--ink-faint);">→</span>
                                <input type="month" value="${esc(e.end_date || '')}" data-field="end_date" data-idx="${i}" style="flex:1">
                            </div>
                        </div>
                    </div>
                    <div class="row-actions">
                        <button class="btn btn-danger btn-sm" onclick="removeEducation(${i})">删除</button>
                    </div>
                `;
                list.appendChild(card);
            });
            // 绑定输入
            list.querySelectorAll('input,select').forEach(el => {
                el.addEventListener('change', () => {
                    profile.education[+el.dataset.idx][el.dataset.field] = el.value;
                });
            });
        }

        function renderExperience() {
            const list = document.getElementById('experienceList');
            list.innerHTML = '';
            const exps = profile.experience || [];
            document.getElementById('expCount').textContent = exps.length;
            if (exps.length === 0) {
                list.innerHTML = '<div class="empty-card"><div class="empty-icon">💼</div><p>还没有工作经历</p></div>';
                return;
            }
            exps.forEach((e, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="card-title">${esc(e.company || '工作经历')} ${e.title ? '· ' + esc(e.title) : ''}</h3>
                        <span class="card-index">${roman(i + 1)}</span>
                    </div>
                    <div class="form-grid">
                        <div class="form-field"><label>公司</label><input type="text" value="${esc(e.company || '')}" data-field="company" data-idx="${i}"></div>
                        <div class="form-field"><label>职位</label><input type="text" value="${esc(e.title || '')}" data-field="title" data-idx="${i}"></div>
                        <div class="form-field full"><label>起止时间</label>
                            <div style="display:flex;gap:0.5rem;align-items:center;">
                                <input type="month" value="${esc(e.start_date || '')}" data-field="start_date" data-idx="${i}" style="flex:1">
                                <span style="color:var(--ink-faint);">→</span>
                                <input type="month" value="${esc(e.end_date || '')}" data-field="end_date" data-idx="${i}" style="flex:1">
                            </div>
                        </div>
                        <div class="form-field full"><label>工作描述</label><textarea data-field="description" data-idx="${i}">${esc(e.description || '')}</textarea></div>
                    </div>
                    <div class="row-actions">
                        <button class="btn btn-danger btn-sm" onclick="removeExperience(${i})">删除</button>
                    </div>
                `;
                list.appendChild(card);
            });
            list.querySelectorAll('input,select,textarea').forEach(el => {
                el.addEventListener('change', () => {
                    profile.experience[+el.dataset.idx][el.dataset.field] = el.value;
                });
            });
        }

        function renderSkills() {
            const editor = document.getElementById('skillsEditor');
            const input = document.getElementById('skillInput');
            // 清除现有标签（保留 input）
            editor.querySelectorAll('.skill-tag').forEach(t => t.remove());
            const skills = profile.skills || [];
            document.getElementById('skillCount').textContent = skills.length;
            skills.forEach((s, i) => {
                const tag = document.createElement('span');
                tag.className = 'skill-tag';
                tag.innerHTML = `${esc(s)} <span class="remove" onclick="removeSkill(${i})">×</span>`;
                editor.insertBefore(tag, input);
            });
        }

        function renderIntent() {
            const j = profile.job_intent || {};
            document.getElementById('intent_role').value = j.role || '';
            document.getElementById('intent_job_type').value = j.job_type || '全职';
            document.getElementById('intent_salary_min').value = j.salary_min || '';
            document.getElementById('intent_salary_max').value = j.salary_max || '';
            // 城市
            const editor = document.getElementById('citiesEditor');
            const input = document.getElementById('cityInput');
            editor.querySelectorAll('.city-tag').forEach(t => t.remove());
            (j.cities || []).forEach((c, i) => {
                const tag = document.createElement('span');
                tag.className = 'city-tag';
                tag.innerHTML = `${esc(c)} <span class="remove" onclick="removeCity(${i})">×</span>`;
                editor.insertBefore(tag, input);
            });
        }

        // ============ 完成度 ============
        function updateCompletion() {
            let filled = 0, total = 0;
            const b = profile.basic_info || {};
            ['name','phone','email','gender','birth'].forEach(k => { total++; if (b[k]) filled++; });
            total++; if ((profile.education || []).length > 0) filled++;
            total++; if ((profile.experience || []).length > 0) filled++;
            total++; if ((profile.skills || []).length > 0) filled++;
            const j = profile.job_intent || {};
            ['role','cities'].forEach(k => { total++; if (j[k] && (Array.isArray(j[k]) ? j[k].length : j[k])) filled++; });
            const pct = total ? Math.round(filled / total * 100) : 0;
            document.getElementById('completionFill').style.width = pct + '%';
            document.getElementById('completionPct').textContent = pct + '%';
        }

        // ============ 添加/删除 ============
        function addEducation() {
            profile.education = profile.education || [];
            profile.education.push({ school: '', major: '', degree: '本科', start_date: '', end_date: '' });
            renderEducation();
            updateCompletion();
        }
        function removeEducation(i) {
            profile.education.splice(i, 1);
            renderEducation();
            updateCompletion();
        }
        function addExperience() {
            profile.experience = profile.experience || [];
            profile.experience.push({ company: '', title: '', start_date: '', end_date: '', description: '' });
            renderExperience();
            updateCompletion();
        }
        function removeExperience(i) {
            profile.experience.splice(i, 1);
            renderExperience();
            updateCompletion();
        }
        function removeSkill(i) {
            profile.skills.splice(i, 1);
            renderSkills();
            updateCompletion();
        }
        function removeCity(i) {
            profile.job_intent.cities.splice(i, 1);
            renderIntent();
            updateCompletion();
        }

        // 技能输入
        document.getElementById('skillInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = e.target.value.trim();
                if (val) {
                    profile.skills = profile.skills || [];
                    if (!profile.skills.includes(val)) {
                        profile.skills.push(val);
                        e.target.value = '';
                        renderSkills();
                        updateCompletion();
                    }
                }
            }
        });
        // 城市输入
        document.getElementById('cityInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = e.target.value.trim();
                if (val) {
                    profile.job_intent = profile.job_intent || {};
                    profile.job_intent.cities = profile.job_intent.cities || [];
                    if (!profile.job_intent.cities.includes(val)) {
                        profile.job_intent.cities.push(val);
                        e.target.value = '';
                        renderIntent();
                        updateCompletion();
                    }
                }
            }
        });

        // basic_info 实时同步
        ['name','phone','email','gender','birth'].forEach(k => {
            document.getElementById('basic_' + k).addEventListener('change', (e) => {
                profile.basic_info = profile.basic_info || {};
                profile.basic_info[k] = e.target.value;
                updateCompletion();
            });
        });
        // job_intent 实时同步
        ['role','job_type','salary_min','salary_max'].forEach(k => {
            const el = document.getElementById('intent_' + k);
            if (el) el.addEventListener('change', (e) => {
                profile.job_intent = profile.job_intent || {};
                const v = e.target.value;
                profile.job_intent[k] = (k.startsWith('salary') && v) ? parseInt(v) : v;
                updateCompletion();
            });
        });

        // ============ 保存 ============
        async function saveAll() {
            try {
                const res = await apiPost('/api/v1/profiles/', profile);
                if (res.code === 0) {
                    toast('画像保存成功', 'success');
                } else {
                    toast('保存失败', 'error');
                }
            } catch (e) {
                toast('保存失败：' + e.message, 'error');
            }
        }

        // ============ 工具 ============
        function esc(s) {
            if (s == null) return '';
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function roman(n) {
            return ['','I','II','III','IV','V','VI','VII','VIII','IX','X'][n] || String(n);
        }

        // 初始化
        loadProfile();
    </script>
</body>
</html>
