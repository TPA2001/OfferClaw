# OfferCabin 网页服务编排
# 用法：docker compose up -d --build
# 首次启动后访问 http://localhost:8000 ，注册账号即可使用
# 管理后台：http://localhost:8001 （仅宿主本地可达，不公网暴露）
services:
  offercabin:
    build: .
    container_name: offercabin
    restart: unless-stopped
    ports:
      - "8000:8000"
      # 管理后台对外网开放（与主站一致）；需强 SECRET_KEY + AUTH_MODE=jwt 守卫
      - "8001:8001"
    environment:
      # 生产必改：强随机密钥（生成方式：openssl rand -hex 32）
      # 管理后台启动硬守卫会拒绝默认密钥
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-random-secret}
      - AUTH_MODE=jwt
      # SQLite 数据文件放在卷中，升级容器不丢数据（服务器实际路径）
      - DATABASE_URL=sqlite:////data/offerclaw.db
      # 管理后台：容器内监听 0.0.0.0（端口映射到宿主 8001，对外网开放）
      - ADMIN_HOST=0.0.0.0
      - ADMIN_PORT=8001
      # 管理后台 CORS 来源（本地访问用 http://localhost:8001）
      - ADMIN_CORS_ORIGINS=http://localhost:8001,http://127.0.0.1:8001
      # 可选：管理端口 IP 白名单（逗号分隔），生产建议显式配置以进一步收窄
      # - ADMIN_ALLOW_IPS=127.0.0.1,::1
      # 账号售卖开关：设置后注册必须携带邀请码（REGISTRATION_INVITE_CODE=xxx）
      # - REGISTRATION_INVITE_CODE=invite-code-here
      # LLM（可选，Agent 功能需要；不配则 AI 功能为 Mock 模式）
      # - AGENT_API_KEY=sk-xxx
      # - AGENT_BASE_URL=https://open.bigmodel.cn/api/paas/v4
      # - AGENT_MODEL=glm-4.5
      # CORS（同域部署不需要改；跨域前端部署时配置具体来源）
      # - CORS_ORIGINS=https://your-domain.com
    volumes:
      # 服务器实际数据库目录：/opt/offerclaw/data/offerclaw.db 原地复用，升级不丢数据
      - /opt/offerclaw/data:/data
