[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "offerclaw"
version = "1.2.0"
description = "OfferClaw - 校招求职 Agent，集成投递看板、Boss 搜索、智能填表、岗位真实性判断"
requires-python = ">=3.10,<3.14"
authors = [{ name = "OfferClaw Team" }]
license = "MIT"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "playwright>=1.45",
    "httpx>=0.27",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ===== Ruff 代码质量配置 =====
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long（由 formatter 处理）
    "B008",  # do not perform function call in argument defaults（FastAPI Depends 需要）
    "B904",  # raise from（部分场景不需要）
    "SIM108", # ternary operator（三元表达式可读性有时不如 if-else）
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
